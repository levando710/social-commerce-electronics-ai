<text x="40" y="710" font-family="Times New Roman, Liberation Serif, serif" font-size="19">Các quan hệ của đồ thị được xem là vô hướng khi lan truyền. Ảnh catalog không xác nhận tình trạng thiết bị đã qua sử dụng.</text>
