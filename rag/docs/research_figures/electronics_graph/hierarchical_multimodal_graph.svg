<text x="650.0" y="568.5" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="21">Đồ thị huấn luyện không chứa cặp người dùng–sản phẩm bị giữ lại; không dùng điểm hay nhãn đánh giá làm đặc trưng văn bản;</text>
